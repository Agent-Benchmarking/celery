# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Celery CI

on:
  push:
    branches: ['main']
    paths:
      - '**.py'
      - '**.txt'
      - '**.toml'
      - '.github/workflows/**'
      - "tox.ini"
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: useblacksmith/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: Run linters
        run: |
          ruff check .
          mypy .

  Unit:
    needs: [Lint]  # Make Unit tests wait for Lint to pass
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: *python-versions
        os: ["blacksmith-4vcpu-ubuntu-2204", "windows-latest"]
        exclude:
          - os: "windows-latest"
            python-version: '3.9'
          - os: "windows-latest"
            python-version: 'pypy-3.10'
          - os: "windows-latest"
            python-version: '3.10'
          - os: "windows-latest"
            python-version: '3.11'
          - os: "windows-latest"
            python-version: '3.13'

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Run tox
        timeout-minutes: 30
        run: tox --verbose --verbose

      - uses: codecov/codecov-action@v5
        with:
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  Integration:
    needs: [Unit]
    if: needs.Unit.result == 'success'
    timeout-minutes: 240
    runs-on: blacksmith-4vcpu-ubuntu-2204
    
    strategy:
      fail-fast: false
      matrix:
        python-version: *python-versions
        toxenv: ['redis', 'rabbitmq', 'rabbitmq_redis']
        exclude:
          - python-version: 'pypy-3.10'

    services:
      redis: &redis_service
        image: redis
        ports: ['6379:6379']
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
      rabbitmq: &rabbitmq_service
        image: rabbitmq
        ports: ['5672:5672']
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Run Integration Tests
        timeout-minutes: 60
        run: tox --verbose --verbose -e "${{ matrix.python-version }}-integration-${{ matrix.toxenv }}" -vv

  Smoke:
    needs: [Unit]
    if: needs.Unit.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.12', '3.13']
        test-case: *smoke-test-cases

    steps:
      - name: Fetch Docker Images
        run: |
          docker pull redis:latest
          docker pull rabbitmq:latest

      - name: Configure System
        run: |
          sudo apt update
          sudo apt-get install -y procps
          sudo sysctl -w vm.overcommit_memory=1

      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Smoke Tests
        timeout-minutes: 60
        run: tox --verbose --verbose -e "${{ matrix.python-version }}-smoke" -- -n auto -k ${{ matrix.test-case }}
