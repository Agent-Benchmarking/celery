# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Celery CI

on:
  push:
    branches: [ 'main' ]
    paths:
      - '**.py'
      - '**.txt'
      - '.github/workflows/python-package.yml'
      - '**.toml'
      - "tox.ini"
  pull_request:
    branches: [ 'main' ]
    paths:
      - '**.py'
      - '**.txt'
      - '**.toml'
      - '.github/workflows/python-package.yml'
      - "tox.ini"
  workflow_dispatch:  # Allow manual triggering

# Define permissions needed for the workflow
permissions:
  contents: read  # to fetch code (actions/checkout)

# Environment variables used across jobs
env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  # Unit tests job
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', 'pypy-3.10']
        os: ["blacksmith-4vcpu-ubuntu-2204", "windows-latest"]
        exclude:
          - python-version: '3.9'
            os: "windows-latest"
          - python-version: 'pypy-3.10'
            os: "windows-latest"
          - python-version: '3.10'
            os: "windows-latest"
          - python-version: '3.11'
            os: "windows-latest"
          - python-version: '3.13'
            os: "windows-latest"

    steps:
      # Install required system packages on Ubuntu
      - name: Install system dependencies
        if: startsWith(matrix.os, 'blacksmith-4vcpu-ubuntu')
        run: |
          sudo apt-get update && sudo apt-get install -f libcurl4-openssl-dev libssl-dev libgnutls28-dev httping expect libmemcached-dev
      
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Setup Python environment
      - name: Set up Python ${{ matrix.python-version }}
        uses: useblacksmith/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: '**/setup.py'
      
      # Install tox for test running
      - name: Install tox
        run: |
          python -m pip install --upgrade pip 'tox>=4.0.0' tox-gh-actions
      
      # Run unit tests
      - name: Run unit tests
        timeout-minutes: 30
        run: |
          tox --verbose --verbose
      
      # Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  # Integration tests job
  integration-tests:
    name: Integration Tests (Python ${{ matrix.python-version }} - ${{ matrix.toxenv }})
    needs: unit-tests
    if: needs.unit-tests.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        toxenv: ['redis', 'rabbitmq', 'rabbitmq_redis']

    # Define services needed for integration tests
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:latest
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Install required system packages
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -f libcurl4-openssl-dev libssl-dev libgnutls28-dev httping expect libmemcached-dev
      
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Setup Python environment
      - name: Set up Python ${{ matrix.python-version }}
        uses: useblacksmith/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: '**/setup.py'
      
      # Install tox for test running
      - name: Install tox
        run: |
          python -m pip install --upgrade pip 'tox>=4.0.0' tox-gh-actions
      
      # Run integration tests
      - name: Run integration tests
        timeout-minutes: 60
        run: >
          tox --verbose --verbose -e
          "${{ matrix.python-version }}-integration-${{ matrix.toxenv }}" -vv

  # Smoke tests job
  smoke-tests:
    name: Smoke Tests (Python ${{ matrix.python-version }} - ${{ matrix.test-case }})
    needs: unit-tests
    if: needs.unit-tests.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.12', '3.13']
        test-case: [
          'failover',
          'quorum_queues',
          'stamping',
          'test_canvas.py',
          'test_consumer.py',
          'test_control.py',
          'test_signals.py',
          'test_tasks.py',
          'test_thread_safe.py',
          'test_worker.py'
        ]

    steps:
      # Fetch Docker images needed for tests
      - name: Fetch Docker Images
        run: |
          docker pull redis:latest
          docker pull rabbitmq:latest
      
      # Configure system settings
      - name: Configure system settings
        run: |
          sudo apt update
          sudo apt-get install -y procps
          sudo sysctl -w vm.overcommit_memory=1
      
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Setup Python environment
      - name: Set up Python ${{ matrix.python-version }}
        uses: useblacksmith/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: '**/setup.py'
      
      # Install tox for test running
      - name: Install tox
        run: |
          python -m pip install --upgrade pip 'tox>=4.0.0' tox-gh-actions
      
      # Run smoke tests
      - name: Run smoke tests
        timeout-minutes: 60
        run: |
          tox --verbose --verbose -e "${{ matrix.python-version }}-smoke" -- -n auto -k ${{ matrix.test-case }}

  # Linting job
  lint:
    name: Lint Code
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10
    
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Setup Python environment
      - name: Set up Python
        uses: useblacksmith/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      
      # Install tox for running linters
      - name: Install tox
        run: |
          python -m pip install --upgrade pip 'tox>=4.0.0'
      
      # Run linting
      - name: Run linting
        run: |
          tox -e lint

  # Documentation checks job
  docs:
    name: Documentation Checks
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10
    
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Setup Python environment
      - name: Set up Python
        uses: useblacksmith/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      
      # Install tox for running doc checks
      - name: Install tox
        run: |
          python -m pip install --upgrade pip 'tox>=4.0.0'
      
      # Run API documentation check
      - name: Run API documentation check
        run: |
          tox -e apicheck
      
      # Run configuration documentation check
      - name: Run configuration documentation check
        run: |
          tox -e configcheck
